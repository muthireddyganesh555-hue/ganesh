<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazon Clone</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>

<!-- Header -->

<header>

<div class="logo">
<h2>ShopEasy</h2>
</div>

<div class="search-box">
<input type="text" placeholder="Search Products">
<button>
<i class="fa-solid fa-magnifying-glass"></i>
</button>
</div>

<div class="menu">

<a href="#">Home</a>
<a href="#">Mobiles</a>
<a href="#">Fashion</a>
<a href="#">Electronics</a>
<a href="#">Grocery</a>

</div>

<div class="icons">

<i class="fa-regular fa-user"></i>

<i class="fa-regular fa-heart"></i>

<i class="fa-solid fa-cart-shopping"></i>

</div>

</header>

<!-- Banner -->

<section class="banner">

<div class="banner-text">

<h1>Big Billion Sale</h1>

<p>Up to 80% OFF</p>

<button>Shop Now</button>

</div>

</section>

<!-- Categories -->

<section class="categories">

<div class="category">📱 Mobiles</div>

<div class="category">💻 Laptops</div>

<div class="category">👕 Fashion</div>

<div class="category">⌚ Watches</div>

<div class="category">👟 Shoes</div>

<div class="category">🛒 Grocery</div>

</section>

<!-- Products -->

<section class="products">

<h2>Today's Deals</h2>

<div class="product-container">

<div class="card">

<img src="images/phone.jpg">

<h3>iPhone 16</h3>

<p>₹79,999</p>

<button>View</button>

<button>Add to Cart</button>

</div>

<div class="card">

<img src="images/laptop.jpg">

<h3>Gaming Laptop</h3>

<p>₹59,999</p>

<button>View</button>

<button>Add to Cart</button>

</div>

<div class="card">

<img src="images/watch.jpg">

<h3>Smart Watch</h3>

<p>₹2,999</p>

<button>View</button>

<button>Add to Cart</button>

</div>

<div class="card">

<img src="images/shoes.jpg">

<h3>Running Shoes</h3>

<p>₹1,999</p>

<button>View</button>

<button>Add to Cart</button>

</div>

</div>

</section>

<footer>

<p>© 2026 ShopEasy. All Rights Reserved.</p>

</footer>

<script src="js/script.js"></script>

</body>
</html>
